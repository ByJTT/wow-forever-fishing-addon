name: Feature request
description: Suggest a small, focused improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This addon stays intentionally minimal. Features should be high value and low complexity.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Keep it concrete and minimal.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This keeps the addon lightweight and taint-safe.
          required: true
